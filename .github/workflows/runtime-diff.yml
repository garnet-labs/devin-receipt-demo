name: Garnet Runtime Review check
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  invalidate-base:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Invalidate runtime checks for superseded base commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runtime-review.mjs invalidate-base

  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run's github.sha is on the default branch, not the PR.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Publish head-bound exhibit check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runtime-review.mjs publish
